<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>114306048_JS2_Lab4</title>
  <link rel="stylesheet" href="114306048_JS2_Lab4.css" />
</head>
<body>
  <h1>Grade Statistics</h1>

  <div class="controls">
    <label>
      Math:
      <input id="mathInput" type="number" min="0" max="100" step="1" placeholder="0 - 100">
    </label>

    <label>
      English:
      <input id="englishInput" type="number" min="0" max="100" step="1" placeholder="0 - 100">
    </label>

    <button id="submitBtn">Submit</button>
  </div>

  <p id="msg" class="msg"></p>

  <table id="gradeTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Math</th>
        <th>English</th>
        <th>Average</th>
      </tr>
    </thead>

    <tbody id="tableBody">
    </tbody>

    <tfoot>
      <tr>
        <td>Avg</td>
        <td id="mathAvg">-</td>
        <td id="englishAvg">-</td>
        <td id="overallAvg">-</td>
      </tr>
    </tfoot>
  </table>

  <script src="114306048_JS2_Lab4.js"></script>
</body>
</html>
