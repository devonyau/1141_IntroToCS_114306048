<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>114306048_Number Guessing Game</title>
</head>
<body>

	<h1>114306048_Number Guessing Game</h1>

	<div id="resultImage"></div>

	<script>
		var answer = Math.floor(Math.random() * 100) + 1;
		var min = 1;
		var max = 100;
		var chances = 7;

		while (chances > 0) {
			var input = window.prompt("Enter an integer between " + min + " and " + max + ".\n" + "Remaining attempts: " + chances);

			if (input === null) {
				break;
			}

			input = input.trim();

			if (input === "" || isNaN(input)) {
				alert("Invalid input! Please enter a valid number.");
				continue;
			}

			var guess = Number(input);

			if (guess < min || guess > max) {
				alert("Out of range! Please enter a number between " + min +  " and "  + max + ".");
				continue;
			}

			if (guess === answer) {
				alert("Congratulations! You are correct! The answer is " + answer + ".");
				document.getElementById("resultImage").innerHTML = '<img src="correct.jpg" alt="correct">';
				break;	
			}

			if (guess < answer) {
				min = guess + 1;
			} else {
				max = guess - 1;
			}

			chances--;

			if (chances === 0) {
				alert("You are out of attempts. The correct answer was " + answer + ".");
				document.getElementById("resultImage").innerHTML = '<img src="wrong.jpg" alt="wrong">';
			}
		}
	</script>

</body>
</html>
